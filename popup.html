<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Target Receipts</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Target Receipts</h1>
      <p id="pageStatus" class="muted">Checking current tab...</p>
    </header>

    <section class="actions">
      <button id="collectBtn">Collect receipt links</button>
      <button id="crawlBtn">Download receipts</button>
      <button id="exportBtn">Export ZIP</button>
      <button id="clearBtn" class="secondary">Clear data</button>
    </section>

    <section class="stats" aria-live="polite">
      <div><span>Links</span><strong id="linksCount">0</strong></div>
      <div><span>Receipts</span><strong id="receiptsCount">0</strong></div>
      <div><span>Failures</span><strong id="failuresCount">0</strong></div>
    </section>

    <section class="statusBox">
      <div class="statusTitle">Status</div>
      <p id="statusMessage">Ready.</p>
      <progress id="progress" value="0" max="1"></progress>
    </section>

    <section id="warningsBox" class="warnings hidden">
      <div class="statusTitle">Warnings</div>
      <ul id="warningsList"></ul>
    </section>
  </main>

  <script src="db.js"></script>
  <script src="zipExporter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
